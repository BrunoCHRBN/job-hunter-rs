[package]
name = "job-hunter-rs"
version = "0.1.0"
edition = "2021"
description = "CLI e TUI em Rust para coleta automatizada de vagas, enriquecimento com Gemini REST v1beta, busca vetorial e Match Score/ATS"
authors = ["Bruno V. Santos"]

[lib]
name = "job_hunter_rs"
path = "src/lib.rs"

[[bin]]
name = "job-hunter"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
dotenvy = "0.15"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"
pdf-extract = "0.12.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
